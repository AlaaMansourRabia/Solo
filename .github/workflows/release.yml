name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check the tag matches package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$ACTUAL" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $ACTUAL"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Solo ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
